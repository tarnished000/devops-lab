# Example only — DO NOT commit real secrets or apply this file as-is.
# Create the real secret imperatively instead, e.g.:
#   kubectl -n notes-app create secret generic notes-db-secret \
#     --from-literal=POSTGRES_USER=notes \
#     --from-literal=POSTGRES_PASSWORD=<a real generated password> \
#     --from-literal=POSTGRES_DB=notes \
#     --from-literal=DATABASE_URL=postgresql://notes:<same password>@db:5432/notes
apiVersion: v1
kind: Secret
metadata:
  name: notes-db-secret
  namespace: notes-app
type: Opaque
stringData:
  POSTGRES_USER: notes
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: notes
  DATABASE_URL: postgresql://notes:changeme@db:5432/notes
