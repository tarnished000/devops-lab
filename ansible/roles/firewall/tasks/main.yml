---
- name: Install ufw
  apt:
    name: ufw
    state: present

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow app HTTP port (nginx)
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: Set default deny policy and enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
